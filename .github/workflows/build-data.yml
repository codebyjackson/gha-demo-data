name: Build data

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", ".github/workflows/build-data.yml"]
  pull_request:
    paths: ["data/**", "scripts/**", ".github/workflows/build-data.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build stats.json from the CSV
        run: python scripts/build_stats.py

      - name: Upload stats.json as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: stats-json
          path: dist/stats.json
          retention-days: 7

  validate:
    # A brand-new runner. It only has stats.json because we download the artifact.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: stats-json
          path: dist

      - name: Check the numbers add up
        run: python3 scripts/validate_stats.py dist/stats.json

  notify-site:
    # Only for changes that landed on main, never for pull requests.
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Tell the site repo that new data is ready
        env:
          # GITHUB_TOKEN can't reach another repo, so this is a fine-grained PAT.
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          SITE_REPO: ${{ vars.SITE_REPO || format('{0}/gha-demo-site', github.repository_owner) }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CROSS_REPO_TOKEN is not set, so the site repo was not notified."
            exit 0
          fi
          gh api "repos/$SITE_REPO/dispatches" \
            -f event_type=data-updated \
            -F "client_payload[run_id]=${{ github.run_id }}" \
            -f "client_payload[sha]=${{ github.sha }}"
          echo "Sent data-updated to $SITE_REPO for run ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
